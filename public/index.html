<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SoundSnatcher</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>" />
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <h1>Sound<span>Snatcher</span></h1>
      <p class="tagline">Paste a link. Snatch the audio.</p>
    </header>

    <!-- Idle: the whole tool is this one row. -->
    <section id="panel-idle" class="panel">
      <form id="snatch-form" autocomplete="off">
        <div class="url-row">
          <input
            id="url"
            type="url"
            name="url"
            placeholder="https://www.youtube.com/watch?v=…"
            spellcheck="false"
            required
          />
          <button type="submit" class="btn btn-primary">Snatch</button>
        </div>

        <label class="checkbox" for="analyze">
          <input type="checkbox" id="analyze" />
          <span class="box" aria-hidden="true"></span>
          <span class="checkbox-text">
            Analyze key &amp; BPM
            <em>Writes them into the download filename</em>
          </span>
        </label>

        <p id="idle-error" class="error" hidden></p>
      </form>
    </section>

    <!-- Working -->
    <section id="panel-working" class="panel" hidden>
      <p class="stage" id="stage-text">Snatching…</p>
      <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
      <p class="stage-hint" id="stage-hint">Pulling the audio stream</p>
    </section>

    <!-- Ready -->
    <section id="panel-ready" class="panel" hidden>
      <div class="track">
        <img id="thumb" class="thumb" alt="" hidden />
        <div class="track-meta">
          <h2 id="track-title">—</h2>
          <p id="track-sub" class="track-sub"></p>
          <div id="badges" class="badges"></div>
        </div>
      </div>

      <div class="formats">
        <p class="formats-label">Format</p>
        <div class="chips" id="chips" role="radiogroup" aria-label="Download format"></div>
      </div>

      <p id="filename-preview" class="filename-preview"></p>

      <div class="actions">
        <button id="download" class="btn btn-primary">Download</button>
        <button id="another" class="btn btn-ghost">Another One</button>
      </div>
    </section>

    <!-- Error -->
    <section id="panel-error" class="panel" hidden>
      <p class="error-title">Couldn't snatch that one.</p>
      <p id="error-detail" class="error-detail"></p>
      <div class="actions">
        <button id="another-error" class="btn btn-ghost">Another One</button>
      </div>
    </section>

    <footer class="foot">
      Local tool — only rip audio you have the rights to use.
    </footer>
  </main>

  <script src="/app.js" type="module"></script>
</body>
</html>
